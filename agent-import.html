<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Importacion por agente | Arriendos Musicala</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero__content">
        <div class="brand">
          <div class="brand__mark">
            <img src="./logo.png" alt="Musicala" />
          </div>
          <div>
            <p class="eyebrow">Musicala - Modo Agente</p>
            <h1>Importacion por agente</h1>
            <p class="hero__text">
              Pega una clave temporal y un JSON grande. La pagina divide en lotes, valida, importa y muestra errores utiles sin guardar la clave.
            </p>
          </div>
        </div>

        <div class="auth-card">
          <a class="btn btn--ghost" href="./index.html">Volver al tablero</a>
        </div>
      </div>
    </header>

    <main class="agent-import">
      <form id="agentImportForm" class="agent-import__panel">
        <section class="agent-step">
          <p class="eyebrow">Paso 1</p>
          <label class="field">
            <span>Endpoint</span>
            <input id="functionUrlInput" type="url" placeholder="https://us-central1-arriendos-musicala.cloudfunctions.net/agentImportRentalOptions" />
          </label>
        </section>

        <section class="agent-step">
          <p class="eyebrow">Paso 2</p>
          <label class="field">
            <span>Clave temporal del agente</span>
            <input id="agentKeyInput" type="password" autocomplete="off" placeholder="Pegar clave temporal" />
          </label>
        </section>

        <section class="agent-step">
          <p class="eyebrow">Paso 3</p>
          <label class="field">
            <span>Pegar JSON</span>
            <textarea id="jsonInput" rows="18" spellcheck="false" placeholder='{"items":[{"title":"Casa amplia cerca a Galerias","zone":"Galerias","rent":6500000}]}'></textarea>
          </label>
        </section>

        <section class="agent-step">
          <p class="eyebrow">Paso 4</p>
          <div id="previewBox" class="agent-import__preview">Sin JSON para importar.</div>
          <div class="agent-import__tools">
            <button id="copyNormalizedBtn" class="btn btn--ghost btn--tiny" type="button">Copiar JSON normalizado</button>
            <button id="downloadNormalizedBtn" class="btn btn--ghost btn--tiny" type="button">Descargar JSON normalizado</button>
            <button id="copyBatch1Btn" class="btn btn--ghost btn--tiny" type="button">Copiar lote 1</button>
            <button id="copyBatch2Btn" class="btn btn--ghost btn--tiny" type="button">Copiar lote 2</button>
          </div>
        </section>

        <section class="agent-step">
          <p class="eyebrow">Paso 5</p>
          <div class="agent-import__settings">
            <label class="check-row">
              <input id="stopOnErrorInput" type="checkbox" checked />
              <span>Detener si un lote falla</span>
            </label>
            <label class="check-row">
              <input id="skipDuplicatesInput" type="checkbox" checked />
              <span>Omitir duplicados locales</span>
            </label>
            <label class="check-row">
              <input id="dryRunInput" type="checkbox" />
              <span>Solo validar, no guardar</span>
            </label>
          </div>

          <div class="agent-import__actions">
            <div id="progressBox" class="agent-import__progress">Listo para importar.</div>
            <button id="importBtn" class="btn btn--primary" type="submit">Importar todo</button>
          </div>
        </section>
      </form>

      <section id="resultBox" class="agent-import__result hidden" aria-live="polite"></section>
    </main>
  </div>

  <script type="module" src="./agent-import.js"></script>
</body>
</html>
